version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<service-name>_1
      APP_HOST: josh-amp_amp_1
      APP_PORT: 8080
      # AMP has its own login, so skip Umbrel's extra login screen
      PROXY_AUTH_ADD: "false"

  amp:
    image: mitchtalmadge/amp-dockerized:latest
    # AMP ties its licence to the machine's MAC address. A fixed MAC stops
    # AMP from deactivating your licence every time the app restarts.
    mac_address: "02:42:ac:4a:4d:50"
    environment:
      UID: "1000"
      GID: "1000"
      TZ: "America/Chicago"
      USERNAME: "admin"
      PASSWORD: "${APP_PASSWORD}"
      AMP_AUTO_UPDATE: "true"
    ports:
      # Minecraft Java Edition (main server + 5 extra servers)
      - "25565-25570:25565-25570/tcp"
      - "25565-25570:25565-25570/udp"
      # Minecraft Bedrock Edition
      - "19132:19132/udp"
    volumes:
      # Everything AMP needs: instances, game files, saves, logins
      - ${APP_DATA_DIR}/data:/home/amp
    stop_grace_period: 1m
    restart: on-failure
